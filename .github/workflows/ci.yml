name: Ground Station CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ground-station-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Validate Python station software
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Python project
        id: project
        shell: bash
        run: |
          if find . -type f \( -name pyproject.toml -o -name requirements.txt -o -name setup.py \) -not -path './.git/*' -print -quit | grep -q . || find . -type f -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Python source or project manifest found. Station checks will activate when the application is added."
          fi

      - name: Install dependencies
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          while IFS= read -r -d '' file; do
            if [[ "$(basename "$file")" == "requirements.txt" ]]; then
              python -m pip install -r "$file"
            fi
          done < <(find . -type f -name requirements.txt -not -path './.git/*' -print0)
          python -m pip install pytest ruff

      - name: Compile Python source
        if: steps.project.outputs.present == 'true'
        run: python -m compileall -q .

      - name: Run lint checks
        if: steps.project.outputs.present == 'true'
        run: ruff check . --output-format=github

      - name: Run unit tests
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          if [[ -d tests ]] || find . -type f -name 'test_*.py' -not -path './.git/*' -print -quit | grep -q .; then
            python -m pytest
          else
            echo "No tests found; skipping."
          fi

      - name: Hardware testing notice
        run: |
          echo "Physical SDR/Raspberry Pi tests are intentionally not run on GitHub-hosted runners."
          echo "Use a secured, dedicated self-hosted Raspberry Pi runner for hardware-in-the-loop tests."
